# /etc/orcd-scrub.conf - sourced by /usr/local/sbin/orcd-scrub (bash syntax)
# All durations are in seconds.

MAX_RUNTIME=$((24*3600))       # no scrub session runs longer than this  (orcd-scrub set max-runtime 24h)
CHECK_AFTER=$((12*3600))       # after this, stop+halve if elapsed+ETA > MAX_RUNTIME  (orcd-scrub set check-after 12h)
POLL_INTERVAL=300              # status poll interval
OVERLAP=$((24*3600))           # each window starts this far before the watermark
MIN_WINDOW=$((2*86400))        # don't halve below this; pause/resume instead (> OVERLAP)
CATCHUP_INTERVAL=$((7*86400))  # after a cut/paused/failed run, next attempt this much later
CONTINUE_INTERVAL=$((7*86400)) # after a COMPLETED partial window, next window this much later  (orcd-scrub set continue-interval 1d)
INTERVAL_SLACK=$((12*3600))    # tolerance for the daily timer
MONTHLY_DAY=1                  # new cycle starts on/after this day of month
LEARN_LIMIT=yes                # keep the halved window size for later cycles
GROW_HEADROOM=75               # double learned window if 2x would need < 75% of MAX_RUNTIME
SHRINK_MAX_HALVINGS=2          # ETA-based cut: halve up to N times at once until it fits 75% (1 = always just half)
ETA_CUT=auto                   # auto: early cut on zpool ETA until ETA proves not window-relative | yes | no
LAG_ALERT=$((62*86400))        # alert if watermark is older than this (0 = off)
ON_TOO_SLOW=auto               # halve | pause (keep window, finish over sessions) | auto: halve unless
                               # the last cut showed the work does not shrink with the window
ADVANCE_ON_ERRORS=yes          # yes: advance watermark even with unrepairable errors (alerted)
DEFAULT_BASELINE=""            # e.g. "2026-09-01" - used by init if no completed scrub found
MAILTO=""                      # e.g. "hpc-admins@example.edu" (needs `mail`)
SERIALIZE_POOLS=yes            # yes: one pool per host at a time; others wait and start after

# Extra stock/legacy timers to disable at install time (%p = pool name)
STOCK_TIMERS=""                # e.g. "zfs-scrub-custom@%p.timer"
